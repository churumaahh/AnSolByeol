<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>진성민 포트폴리오</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0d;
      --panel: #12161b;
      --panel-2: #191f26;
      --line: #2b333d;
      --text: #f4f0df;
      --muted: #aeb7bf;
      --green: #67bf4b;
      --cyan: #24c7d8;
      --gold: #f0c63e;
      --red: #e25454;
      --shadow: 0 18px 60px rgba(0, 0, 0, .38);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(36, 199, 216, .08), transparent 34rem),
        radial-gradient(circle at 16% 8%, rgba(103, 191, 75, .18), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 18px;
      padding: 22px 18px;
      background: rgba(18, 22, 27, .94);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: grid;
      gap: 10px;
    }

    .brand__head {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
    }

    .brand__mark {
      width: 58px;
      height: 58px;
      overflow: hidden;
      border: 2px solid rgba(244, 240, 223, .72);
      border-radius: 8px;
      background: #050607;
      box-shadow: 0 0 0 4px rgba(36, 199, 216, .12);
    }

    .brand__mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.15;
      word-break: keep-all;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.55;
      word-break: keep-all;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      padding: 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      color: var(--gold);
      font-size: 1.05rem;
    }

    .stat span {
      color: var(--muted);
      font-size: .78rem;
    }

    .thumbs {
      overflow: auto;
      padding-right: 4px;
    }

    .thumb-grid {
      display: grid;
      gap: 10px;
    }

    .thumb {
      display: grid;
      grid-template-columns: 82px;
      align-items: center;
      width: max-content;
      padding: 8px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
    }

    .thumb:hover,
    .thumb.is-active {
      background: rgba(36, 199, 216, .09);
      border-color: rgba(36, 199, 216, .5);
    }

    .thumb img {
      width: 82px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(244, 240, 223, .2);
      background: #000;
    }

    .thumb strong {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
      font-size: .88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb span {
      color: var(--muted);
      font-size: .75rem;
    }

    .side-actions {
      display: grid;
      gap: 8px;
    }

    .link-button,
    .icon-button {
      min-height: 40px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .link-button:hover,
    .icon-button:hover {
      border-color: var(--gold);
    }

    main {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px clamp(16px, 4vw, 36px);
      background: rgba(9, 11, 13, .86);
      border-bottom: 1px solid rgba(43, 51, 61, .85);
      backdrop-filter: blur(18px);
    }

    .mobile-brand {
      display: none;
    }

    .written-date {
      position: fixed;
      top: auto;
      right: auto;
      bottom: 12px;
      left: 18px;
      z-index: 6;
      color: var(--muted);
      font-size: .66rem;
      line-height: 1;
      pointer-events: none;
    }

    .mobile-brand h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.15;
      word-break: keep-all;
    }

    .name-gradient {
      background: linear-gradient(90deg, var(--green), var(--gold), var(--cyan), var(--green));
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: nameFlow 4s linear infinite;
    }

    .mobile-tagline {
      display: none;
    }

    @keyframes nameFlow {
      to {
        background-position: 260% 0;
      }
    }

    .mobile-summary {
      display: none;
    }

    .page-title {
      min-width: 0;
      order: 2;
    }

    .page-title span {
      display: block;
      color: var(--muted);
      font-size: .8rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      order: 1;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      padding: 0;
      color: var(--text);
    }

    .progress {
      width: min(320px, 28vw);
      height: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #050607;
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--gold), var(--cyan));
    }

    .stage {
      display: grid;
      gap: 28px;
      padding: 28px clamp(14px, 4vw, 42px) 56px;
    }

    .page {
      display: grid;
      gap: 10px;
      scroll-margin-top: 86px;
    }

    .page figure {
      position: relative;
      width: min(100%, 1120px);
      margin: 0;
      margin-inline: auto;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(244, 240, 223, .16);
      border-radius: 8px;
      background: #000;
      box-shadow: var(--shadow);
    }

    .page figcaption {
      width: min(100%, 1120px);
      margin-inline: auto;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: .86rem;
    }

    .mobile-rail {
      display: none;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 22, 27, .92);
    }

    .mobile-rail button {
      flex: 0 0 auto;
      width: 54px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--muted);
      cursor: pointer;
    }

    .mobile-rail button.is-active {
      color: #07100b;
      border-color: var(--green);
      background: var(--green);
      font-weight: 800;
    }

    @media (max-width: 920px) {
      .app {
        display: block;
      }

      .sidebar {
        position: static;
        height: auto;
        grid-template-rows: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding-top: 94px;
      }

      .brand .brand__head {
        display: none;
      }

      .brand p {
        display: none;
      }

      .mobile-brand {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 7;
        display: grid;
        grid-template-columns: 58px minmax(132px, 1fr);
        align-items: start;
        gap: 12px;
        padding: 12px 14px;
        background: rgba(18, 22, 27, .94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .written-date {
        top: auto;
        right: auto;
        bottom: 86px;
        left: 14px;
        font-size: .62rem;
      }

      .mobile-brand .brand__mark {
        transform: translateY(5px);
      }

      .mobile-brand h1 {
        font-size: calc(1.45rem - 4px);
      }

      .mobile-tagline {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: .7rem;
        line-height: 1.25;
        white-space: nowrap;
      }

      .thumbs {
        display: none;
      }

      .side-actions {
        grid-template-columns: 1fr 1fr;
      }

      .stats,
      .side-actions {
        display: none;
      }

      .mobile-rail {
        display: none;
      }

      .topbar {
        position: fixed;
        left: 0;
        right: 0;
        top: auto;
        bottom: 0;
        align-items: center;
        justify-content: center;
        min-height: 74px;
        padding: 10px 14px 24px;
      }

      .page-title {
        position: absolute;
        left: auto;
        right: 14px;
        top: 50%;
        order: 0;
        min-width: auto;
        transform: translateY(-50%);
        text-align: right;
      }

      .page-title span {
        color: var(--text);
        font-size: 1.08rem;
        font-weight: 800;
      }

      .controls {
        position: absolute;
        left: 14px;
        top: 50%;
        order: 0;
        transform: translateY(-50%);
      }

      .stage {
        padding-bottom: 154px;
      }

    }

    @media (max-width: 560px) {
      .sidebar {
        padding: 94px 14px 18px;
      }

      .topbar {
        padding: 12px 14px;
      }

      .page-title span {
        font-size: 1rem;
      }

      .controls {
        gap: 6px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
      }

      .stage {
        gap: 18px;
        padding: 18px 10px 154px;
      }

      .page img {
        border-radius: 6px;
      }

      .page figcaption {
        font-size: .78rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="mobile-brand" aria-hidden="true">
      <div class="brand__mark"><img src="./assets/profile.jpg" alt=""></div>
      <h1>지원자 <span class="name-gradient">안솔별</span><br>포트폴리오</h1>
    </div>
    <aside class="sidebar">
      <section class="brand" aria-label="Portfolio">
        <div class="brand__head">
          <div class="brand__mark"><img src="./assets/profile.jpg" alt="진성민 프로필 사진"></div>
          <h1>지원자 <span class="name-gradient">안솔별</span><br>포트폴리오</h1>
        </div>
        <p>마인크래프트 콘셉트로 구성</p>
        <div class="stats" aria-label="Portfolio stats">
          <div class="stat"><strong>21</strong><span>Pages</span></div>
          <div class="stat"><strong>PDF</strong><span>Source</span></div>
        </div>
      </section>

      <nav class="thumbs" aria-label="Pages">
        <div class="thumb-grid" id="thumbs"></div>
      </nav>

      <div class="side-actions">
        <a class="link-button" href="./portfolio.pdf" target="_blank" rel="noreferrer">원본 PDF</a>
        <a class="link-button" href="#page-01">처음으로</a>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="page-title">
          <span id="currentMeta">01 / 21</span>
        </div>
        <div class="controls">
          <button class="icon-button" id="prevPage" type="button" aria-label="Previous page" title="Previous page">&lt;</button>
          <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
          <button class="icon-button" id="nextPage" type="button" aria-label="Next page" title="Next page">&gt;</button>
        </div>
      </header>

      <nav class="mobile-rail" id="mobileRail" aria-label="Mobile pages"></nav>
      <section class="stage" id="stage" aria-label="Portfolio pages"></section>
    </main>
  </div>

  <script>
    const pages = [
      'Cover',
      'Character Profile',
      'Tools',
      'Contents',
      'Project 01',
      'Project 01 Detail',
      'Project 01 Result',
      'Project 02',
      'Project 02 Detail',
      'Project 02 Result',
      'Project 03',
      'Project 03 Detail',
      'Project 03 Result',
      'Project 04',
      'Project 04 Detail',
      'Project 04 Result',
      'Project 05',
      'Project 05 Detail',
      'Project 05 Result',
      'Closing',
      'Thanks'
    ].map((title, index) => ({
      title,
      number: index + 1,
      image: `./assets/pages/page-${String(index + 1).padStart(2, '0')}.png`
    }));

    const stage = document.querySelector('#stage');
    const thumbs = document.querySelector('#thumbs');
    const mobileRail = document.querySelector('#mobileRail');
    const currentMeta = document.querySelector('#currentMeta');
    const progressBar = document.querySelector('#progressBar');
    let activeIndex = 0;
    let railScrollTimer;

    function pad(number) {
      return String(number).padStart(2, '0');
    }

    function goTo(index) {
      const safeIndex = Math.max(0, Math.min(pages.length - 1, index));
      document.querySelector(`#page-${pad(safeIndex + 1)}`).scrollIntoView({ block: 'start' });
    }

    function setActive(index) {
      activeIndex = index;
      const page = pages[index];
      currentMeta.textContent = `${pad(page.number)} / ${pages.length}`;
      progressBar.style.width = `${((index + 1) / pages.length) * 100}%`;

      document.querySelectorAll('[data-page-button]').forEach((button) => {
        button.classList.toggle('is-active', Number(button.dataset.pageButton) === index);
      });

      clearTimeout(railScrollTimer);
      railScrollTimer = setTimeout(() => {
        const button = mobileRail.querySelector(`[data-page-button="${index}"]`);
        if (!button || mobileRail.scrollWidth <= mobileRail.clientWidth) return;

        const railRect = mobileRail.getBoundingClientRect();
        const buttonRect = button.getBoundingClientRect();
        const edgePadding = Math.min(140, mobileRail.clientWidth * .28);
        const isComfortablyVisible =
          buttonRect.left >= railRect.left + edgePadding &&
          buttonRect.right <= railRect.right - edgePadding;

        if (isComfortablyVisible) return;

        mobileRail.scrollTo({
          left: button.offsetLeft - (mobileRail.clientWidth / 2) + (button.clientWidth / 2),
          behavior: 'smooth'
        });
      }, 140);
    }

    pages.forEach((page, index) => {
      const id = `page-${pad(page.number)}`;
      const section = document.createElement('article');
      section.className = 'page';
      section.id = id;
      section.dataset.index = index;
      section.innerHTML = `
        <figure>
          <figcaption><span></span><span>${pad(page.number)} / ${pages.length}</span></figcaption>
        </figure>
      `;
      stage.append(section);

      const thumb = document.createElement('button');
      thumb.className = 'thumb';
      thumb.type = 'button';
      thumb.dataset.pageButton = index;
      thumb.setAttribute('aria-label', `${page.title} ${pad(page.number)} / ${pages.length}`);
      thumb.addEventListener('click', () => goTo(index));
      thumbs.append(thumb);

      const mobileButton = document.createElement('button');
      mobileButton.type = 'button';
      mobileButton.dataset.pageButton = index;
      mobileButton.textContent = pad(page.number);
      mobileButton.addEventListener('click', () => goTo(index));
      mobileRail.append(mobileButton);
    });

    let activeUpdateFrame;

    function updateActiveFromScroll() {
      if (activeUpdateFrame) return;

      activeUpdateFrame = requestAnimationFrame(() => {
        activeUpdateFrame = null;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;

        if (window.scrollY >= maxScroll - 2) {
          setActive(pages.length - 1);
          return;
        }

        const pageElements = Array.from(document.querySelectorAll('.page'));
        const lastPage = pageElements[pageElements.length - 1];
        const lastPageRect = lastPage.getBoundingClientRect();

        if (lastPageRect.top < window.innerHeight * .64) {
          setActive(pages.length - 1);
          return;
        }

        const targetY = window.innerHeight * .55;
        const bestPage = pageElements
          .map((element) => {
            const rect = element.getBoundingClientRect();
            const distance = rect.top <= targetY && rect.bottom >= targetY
              ? 0
              : Math.min(Math.abs(rect.top - targetY), Math.abs(rect.bottom - targetY));

            return { element, distance };
          })
          .sort((a, b) => a.distance - b.distance)[0];

        if (bestPage) {
          setActive(Number(bestPage.element.dataset.index));
        }
      });
    }

    window.addEventListener('scroll', updateActiveFromScroll, { passive: true });
    window.addEventListener('resize', updateActiveFromScroll);
    document.querySelector('#prevPage').addEventListener('click', () => goTo(activeIndex - 1));
    document.querySelector('#nextPage').addEventListener('click', () => goTo(activeIndex + 1));
    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') goTo(activeIndex - 1);
      if (event.key === 'ArrowRight') goTo(activeIndex + 1);
    });

    setActive(0);
    updateActiveFromScroll();
  </script>
</body>
</html>
